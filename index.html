<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寻宝大冒险</title>
    <link href="treasure.css" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <h1>寻宝大冒险</h1>
        <!-- 探险地图 -->
        <div class="map-container">
            <h3>探险地图</h3>
            <svg class="treasure-map" viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg">
                <!-- 地形背景 -->
                <rect x="0" y="0" width="500" height="200" fill="#e8f5e9" />
                <path d="M0,100 Q125,50 250,100 T500,100" stroke="#81c784" stroke-width="2" fill="none" />
                
                <!-- 路径 -->
                <!-- 修改 treasure.html 中的路径定义 -->
                <path id="path" d="M50,100 L120,80 L170,95 L220,112 L270,130 L340,70 L390,110 L450,90" 
                stroke="#bcaaa4" stroke-width="4" fill="none" stroke-dasharray="5,3" />
                
                <!-- 起点 -->
                <circle id="point1" cx="50" cy="100" r="8" fill="#ffc107" />
                <text x="50" y="80" text-anchor="middle" font-size="12">起点</text>
                
                <!-- 图书馆 -->
                <circle id="point2" cx="120" cy="80" r="8" fill="#9e9e9e" />
                <text x="120" y="60" text-anchor="middle" font-size="12">图书馆</text>

                <!-- 河流 -->
                <circle id="point3" cx="170" cy="95" r="8" fill="#9e9e9e" />
                <text x="152" y="85" text-anchor="middle" font-size="12">河流</text>
    
                <!-- 山峰 -->
                <circle id="point4" cx="220" cy="112" r="8" fill="#9e9e9e" />
                <text x="230" y="103" text-anchor="middle" font-size="12">山峰</text>

                <!-- 神庙入口 -->
                <circle id="point5" cx="270" cy="130" r="8" fill="#9e9e9e" />
                <text x="270" y="150" text-anchor="middle" font-size="12">神庙入口</text>
                
                <!-- 神庙内部 -->
                <circle id="point6" cx="340" cy="70" r="8" fill="#9e9e9e" />
                <text x="330" y="50" text-anchor="middle" font-size="12">神庙内部</text>
                
                <!-- 宝箱房间 -->
                <circle id="point7" cx="390" cy="110" r="8" fill="#9e9e9e" />
                <text x="390" y="130" text-anchor="middle" font-size="12">宝箱房间</text>
                
                <!-- 宝藏点 -->
                <circle id="point8" cx="450" cy="90" r="8" fill="#9e9e9e" />
                <text x="450" y="70" text-anchor="middle" font-size="12">宝藏</text>
                
                <!-- 当前位置标记 -->
                <circle id="current-position" cx="50" cy="100" r="6" fill="#f44336" opacity="0" />
            </svg>
        </div>
        
        <div class="step-indicator">
            <div class="step" data-step="1">1</div>
            <div class="step" data-step="2">2</div>
            <div class="step" data-step="3">3</div>
            <div class="step" data-step="4">4</div>
            <div class="step" data-step="5">5</div>
            <div class="step" data-step="6">6</div>
            <div class="step" data-step="7">7</div>
            <div class="step" data-step="8">8</div>
        </div>
        
        <div class="scene" id="scene">
            准备开始寻宝冒险！
        </div>
        
        <div class="message-box" id="message">
            点击下方按钮开始你的寻宝之旅
        </div>
        
        <button class="start-btn" id="startBtn">开始寻宝</button>
    </div>

    <script src="treasure.js"></script>
</body>
</html>
